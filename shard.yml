name: drx_api
version: 0.1.0

authors:
  - zendrx <ynwghosted@icloud.com>

targets:
  drx_api:
    main: src/drx_api.cr

dependencies:
  kemal:
    github: kemalcr/kemal
  
  # For HTTP requests (News, Translation, IP Check)
  crest:
    github: mamantoha/crest

  # For Markdown to HTML conversion
  markd:
    github: icyleaf/markd

  # For high-speed HTML parsing (Scraper, Unfurl)
  lexbor:
    github: kostya/lexbor

  # For generating QR Codes natively
  qr-code:
    github: spider-gazelle/qr-code

license: MIT
